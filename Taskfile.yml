# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  kubernetes-proxy:
    cmds:
      # Override the default reject-paths: kubectl proxy blocks pod exec/attach
      # by default, which breaks the Terminal tab in dev (403 on the websocket).
      - kubectl proxy --address=127.0.0.1 --port=8001 --reject-paths='^/never-reject$'

  docker-proxy:
    cmds:
      - socat -4 TCP-LISTEN:2375,bind=127.0.0.1,fork UNIX-CONNECT:/var/run/docker.sock
  
  install:
    cmds:
      - cmd: go install ./cmd/kubectl-bridge
      - task: install-darwin
      - task: install-windows      
      
  install-darwin:
    platforms: [darwin]
    cmds:      
      - task: build
      - cmd: mkdir -p ~/Applications
      - cmd: rm -rf ~/Applications/Bridge.app
      - cmd: mv app/build/bin/Bridge.app ~/Applications/

  install-windows:
    platforms: [windows]
    cmds:
      - task: build
      - cmd: mkdir -p %LOCALAPPDATA%\Programs
      - cmd: rm -f %LOCALAPPDATA%\Programs\Bridge.exe
      - cmd: mv app/build/bin/Bridge.exe %LOCALAPPDATA%\Programs\

  build:
    dir: app
    cmds:
      # Pinned wails CLI (keep in sync with app/go.mod and .goreleaser.app.yml).
      - go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build -clean

  release:app:
    desc: Release the macOS desktop app + Homebrew cask (macOS only; needs GITHUB_TOKEN)
    cmds:
      # --skip=validate: `wails build` may regenerate tracked bindings, dirtying the tree.
      - goreleaser release --clean --skip=validate -f .goreleaser.app.yml

